<a class="skip-link" href="#main">{{ t('app.skipToContent') }}</a>

<div class="shell">
  <header class="shell__header">
    <a class="shell__brand" routerLink="/">Threadline</a>
    <span class="shell__tagline">{{ t('app.tagline') }}</span>

    <div class="shell__tools">
      <app-language-switch />
      <app-account-menu />
    </div>
  </header>

  <main id="main" class="shell__main">
    <router-outlet />
  </main>

  <footer class="shell__footer">
    <span>{{ t('app.stack') }}</span>
  </footer>
</div>

<app-lightbox />
