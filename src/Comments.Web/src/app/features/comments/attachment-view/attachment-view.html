@let file = attachment();

@if (file.kind === 'Image') {
  <button
    type="button"
    class="attachment attachment--image"
    (click)="open(file)"
    [attr.aria-label]="t('attachment.open', { name: file.originalFileName })"
  >
    <img
      class="attachment__thumb"
      [src]="thumbnailUrl(file)"
      [alt]="file.originalFileName"
      [width]="file.width ?? 320"
      [height]="file.height ?? 240"
      loading="lazy"
      decoding="async"
    />
  </button>
} @else {
  <button
    type="button"
    class="attachment attachment--text"
    (click)="open(file)"
    [attr.aria-label]="t('attachment.openText', { name: file.originalFileName })"
  >
    <span class="attachment__icon" aria-hidden="true">TXT</span>
    <span class="attachment__meta">
      <span class="attachment__name">{{ file.originalFileName }}</span>
      <span class="attachment__size">{{ formatSize(file.sizeBytes) }}</span>
    </span>
  </button>
}
