worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Pre-compressed assets produced by the Angular build are served directly instead of being
    # gzipped again on every request.
    gzip_static on;

    upstream api {
        server api:8080;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # The SPA and the API share an origin. That removes CORS from the picture entirely and lets
        # the client-id cookie be a plain first-party cookie rather than a cross-site one.
        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Uploads go through here; the default 1 MB would reject a perfectly legal photograph.
            client_max_body_size 12m;
        }

        location /graphql {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SignalR needs the connection upgraded and a long read timeout, otherwise the socket is
        # closed every 60 seconds and the client reconnects forever.
        location /hubs/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /health/ {
            proxy_pass http://api;
            access_log off;
        }

        # Hashed bundles never change content, so they can be cached forever.
        location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html must not be cached, or a deploy leaves browsers pointing at bundles that no
        # longer exist.
        location = /index.html {
            add_header Cache-Control "no-store, must-revalidate";
        }

        location = /config.js {
            add_header Cache-Control "no-store, must-revalidate";
        }

        # Client-side routing: any unknown path is a route, not a missing file.
        location / {
            try_files $uri $uri/ /index.html;
        }

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
