worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Pre-compressed assets produced by the Angular build are served directly instead of being
    # gzipped again on every request.
    gzip_static on;

    # Resolve the API through Docker's embedded DNS on every request (cached 10 s) instead of once at
    # start-up. A static upstream pins the container IP it saw at boot, so restarting or scaling the
    # API leaves nginx proxying to an address that no longer exists — a 502 until nginx restarts.
    resolver __RESOLVER__ valid=10s ipv6=off;

    # Azure terminates TLS on the internal ingress, so there the upstream is https. Without SNI the
    # edge cannot pick a certificate and the handshake fails; harmless for a plain http upstream.
    proxy_ssl_server_name on;
    map $host $api_upstream { default "__API_UPSTREAM__"; }

    # The upstream host name, not the browser's. Azure Container Apps routes internal traffic by
    # the Host header, so forwarding the public host makes its ingress answer "Unavailable"
    # instead of reaching the API. Under Compose the API ignores the header either way.
    #
    # Because Host is overwritten, the browser's own host is passed separately as X-Forwarded-Host.
    # The API needs it to address itself: the OAuth redirect_uri is built from the incoming request,
    # and without this it would name the internal FQDN — an address Google cannot reach and would
    # refuse to redirect to.
    map $host $api_host { default "__API_HOST__"; }

    # The scheme the *browser* used, which is not the scheme nginx sees. On Azure the public
    # ingress terminates TLS and speaks plain HTTP to this container, so forwarding $scheme tells
    # the API that an HTTPS request was insecure — and it then issues the session cookie without
    # Secure. Where an upstream proxy already stated the scheme, that answer is passed through
    # unchanged; under Compose, where nothing does, $scheme is the original and is used as is.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        # Both stacks: Alpine resolves "localhost" to ::1, so an IPv4-only listener fails any probe
        # that uses the name rather than the address.
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # The SPA and the API share an origin. That removes CORS from the picture entirely and lets
        # the client-id cookie be a plain first-party cookie rather than a cross-site one.
        location /api/ {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $api_host;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Uploads go through here; the default 1 MB would reject a perfectly legal photograph.
            client_max_body_size 12m;
        }

        location /graphql {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $api_host;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # SignalR needs the connection upgraded and a long read timeout, otherwise the socket is
        # closed every 60 seconds and the client reconnects forever.
        location /hubs/ {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $api_host;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /health/ {
            proxy_pass $api_upstream;
            # HTTP/1.0 is what nginx proxies with by default, and Azure's ingress answers it with 426.
            proxy_http_version 1.1;
            proxy_set_header Host $api_host;
            access_log off;
        }

        # Hashed bundles never change content, so they can be cached forever.
        location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # index.html must not be cached, or a deploy leaves browsers pointing at bundles that no
        # longer exist.
        location = /index.html {
            add_header Cache-Control "no-store, must-revalidate";
            include /etc/nginx/security-headers.conf;
        }

        location = /config.js {
            add_header Cache-Control "no-store, must-revalidate";
            include /etc/nginx/security-headers.conf;
        }

        # Client-side routing: any unknown path is a route, not a missing file.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Everything nginx serves itself gets this set; the locations that declare their own
        # Cache-Control include the same file, because nginx would otherwise drop these.
        include /etc/nginx/security-headers.conf;

        # A proxied response already carries the API's own copies of all of these. Hiding them
        # leaves exactly one value per header: nginx's. Two Content-Security-Policy headers are not
        # a mistake a browser reports — it silently enforces the intersection — so the one place
        # that decides the policy should be the one that serves the page.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
    }
}
