# Security headers for everything nginx serves itself — the SPA shell, its bundles and config.js.
#
# These live in a file rather than in the server block because nginx drops every inherited
# add_header the moment a context declares one of its own, and the static locations set their own
# Cache-Control. Including the file is the only way to say "and these too" without repeating them.
#
# The API sends its own, stricter set on its responses (see UseSecurityHeaders): there
# 'default-src none' costs nothing, because JSON loads nothing. This page does load things.
#
# Critical-CSS inlining is off in the production build (see angular.json): it emits a stylesheet
# link with onload="this.media='all'", an inline event handler that script-src would block, and a
# blocked handler means the page never switches that stylesheet on.
#
# style-src allows 'unsafe-inline' because Angular injects component styles as inline <style>
# elements; scripts get no such exemption, and script-src is the directive that makes an injected
# <script> inert. img-src allows blob: for the local preview of a chosen picture, and data: for the
# inline icons in the bundle.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
