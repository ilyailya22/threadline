name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless; cancelling it keeps the queue
# short and the feedback fast.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Warnings are errors in this solution, and NuGet auditing is on, so a newly disclosed CVE in
      # a dependency fails the build rather than sitting unnoticed.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The same checks the IDE shows, including suggestions: naming, unused usings, formatting.
      - name: Style check
        run: dotnet format --no-restore --verify-no-changes --severity info

      - name: Unit tests
        run: >
          dotnet test tests/Comments.UnitTests
          --no-build --configuration Release
          --logger "trx;LogFileName=unit.trx"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      # Integration tests bring up real SQL Server, Redis, RabbitMQ, Elasticsearch and Azurite via
      # Testcontainers. Slower than mocks, and the only way to know the EF mappings, the outbox and
      # the search queries actually work against the engines they target.
      - name: Integration tests
        run: >
          dotnet test tests/Comments.IntegrationTests
          --no-build --configuration Release
          --logger "trx;LogFileName=integration.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results

  frontend:
    name: Frontend — build & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/Comments.Web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/Comments.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Format check
        run: npx prettier --check "src/**/*.{ts,html,scss}"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build -- --configuration production

      - name: Test
        run: npm test -- --watch=false

  containers:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    strategy:
      matrix:
        include:
          - image: comments-api
            dockerfile: src/Comments.Api/Dockerfile
          - image: comments-worker
            dockerfile: src/Comments.Worker/Dockerfile
          - image: comments-web
            dockerfile: src/Comments.Web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed on CI: this proves the Dockerfiles work on every pull request without
      # giving a pull request write access to the registry.
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  infrastructure:
    name: Bicep — validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Bicep
        run: az bicep build --file deploy/bicep/main.bicep --stdout > /dev/null

      - name: Lint Bicep
        run: az bicep lint --file deploy/bicep/main.bicep
